name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "beta/**"

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format-check Python
        run: |
          python -m ruff check custom_components tests
          python -m ruff format --check custom_components tests
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  card:
    name: Card
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install exact Card build dependencies
        run: npm ci
      - name: Install Chromium for isolated browser runtime test
        run: npx playwright install --with-deps chromium
      - name: Verify Card
        run: npm run verify

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Reject remote script and image assets
        run: python tests/check_built_docs.py site

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate HACS package
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93
